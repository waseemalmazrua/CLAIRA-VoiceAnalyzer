name: claira-test

services:
  redis-test:
    image: redis:7-alpine
    container_name: claira-redis-test
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
