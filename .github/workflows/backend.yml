name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bento_services/**"
      - "migrations/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "bento_services/**"
      - "migrations/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest -q

  deploy:
    name: Deploy to FastAPI Cloud
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Deploy
        run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Smoke test production
        env:
          API_URL: https://voice.claira.dev
        run: |
          set -euo pipefail

          echo "1/2 Health check"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$API_URL/" > /dev/null

          echo "2/2 Auth is enforced"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API_URL/analyze-audio" \
            -F "file=@README.md;type=text/plain")
          if [ "$code" != "401" ]; then
            echo "Expected 401 without a token, got $code"
            exit 1
          fi

          echo "Smoke tests passed"