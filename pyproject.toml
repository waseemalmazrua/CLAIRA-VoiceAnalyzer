[project]
name = "medical-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bentoml>=1.4.38",
    "fastapi-cloud-cli>=0.26.0",
    "fastapi-redis-sdk[otel]==0.8.0",
    "fastapi[standard]>=0.136.1",
    "faster-whisper>=1.2.1",
    "gliner>=0.2.24",
    "groq>=1.2.0",
    "logfire[fastapi,httpx,redis,system-metrics]>=4.32.1",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.75.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "torch>=2.11.0",
    "transformers>=5.7.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.fastapi]
entrypoint = "app.main:app"
