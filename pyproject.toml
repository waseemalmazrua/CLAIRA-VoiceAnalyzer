[project]
name = "medical-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bentoml>=1.4.38",
    "fastapi-cloud-cli>=0.26.0",
    "fastapi-redis-sdk[otel]==0.8.0",
    "fastapi[standard]>=0.136.1",
    "faster-whisper>=1.2.1",
    "gliner>=0.2.24",
    "groq>=1.2.0",
    "logfire[fastapi,httpx,redis,system-metrics]>=4.32.1",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.75.0",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "torch>=2.11.0",
    "transformers>=5.7.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-env>=1.7.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.fastapi]
entrypoint = "app.main:app"


[tool.ty.src]
exclude = ["migrations"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
env = [
    # App settings (app/core/config.py)
    "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test",
    "REDIS_URL=redis://localhost:6380/0",
    "OPENAI_API_KEY=test-openai-key",
    "GROQ_API_KEY=test-groq-key",
    "RUNPOD_API_KEY=test-runpod-key",
    "ALLOW_ORIGINS=https://app.claira.dev",
    "LOGFIRE_SEND_TO_LOGFIRE=false",
    "SUPABASE_URL=https://test-project.supabase.co",
    # redis_fastapi settings
    "REDIS_PREFIX=claira-test",
    "REDIS_RATE_LIMIT_DEFAULT_LIMIT=0",
    "REDIS_RATE_LIMIT_EMIT_HEADERS=true",
    "REDIS_RATE_LIMIT_FAIL_CLOSED=false",
    "REDIS_OTEL_ENABLED=false",
]
